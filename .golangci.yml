version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars

  settings:
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

      # h.do close response bodies through t.Cleanup.
      - path: internal/api/api_test\.go
        text: 'response body must be closed'
        source: 'h\.do\('
        linters:
          - bodyclose

formatters:
  enable:
    - gofmt